<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI URL Checker - 접속 검사 중</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f1f5f9;
  }

  .card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    backdrop-filter: blur(8px);
  }

  .spinner {
    width: 56px;
    height: 56px;
    margin: 0 auto 24px;
    border: 4px solid rgba(255, 255, 255, 0.15);
    border-top-color: #38bdf8;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  p.status {
    font-size: 14px;
    color: #94a3b8;
    word-break: break-all;
    margin-bottom: 4px;
  }

  .url-box {
    margin-top: 16px;
    padding: 10px 14px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 8px;
    font-size: 13px;
    color: #cbd5e1;
    word-break: break-all;
  }

  .error-box {
    display: none;
    margin-top: 20px;
    padding: 16px;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.35);
    border-radius: 10px;
    font-size: 13px;
    color: #fecaca;
    text-align: left;
  }

  .retry-btn {
    margin-top: 16px;
    padding: 10px 20px;
    background: #38bdf8;
    color: #0f172a;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  .retry-btn:hover {
    background: #0ea5e9;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="statusTitle">사이트 안전성 검사 중입니다...</h1>
    <p class="status">AI 모델이 URL과 페이지 구조를 분석하고 있습니다.</p>

    <div class="url-box" id="targetUrl"></div>

    <div class="error-box" id="errorBox">
      <strong>⚠ 검사 요청에 실패했습니다.</strong>
      <div id="errorDetail" style="margin-top: 6px;"></div>
    </div>

    <button class="retry-btn" id="retryBtn" style="display:none;" onclick="runCheck()">
      다시 시도
    </button>
  </div>

  <script>
    // ============================================================
    // 설정
    // ============================================================

    // FastAPI 서버 주소 (배포 시 실제 서버 주소로 변경)
    const API_BASE_URL = "/urlcheck_api";

    // 검사 실패(네트워크 오류 등) 시 안전 정책: true면 로그인 허용, false면 차단
    const FAIL_OPEN = false;

    // ============================================================
    // 검사 대상 URL: 현재 접속한 페이지의 URL
    // ============================================================

    const targetUrl = window.location.href;
    document.getElementById("targetUrl").textContent = targetUrl;

    // ============================================================
    // 결과에 따른 페이지 이동
    // ============================================================

    function goToLogin() {
      window.location.href = "login.html";
    }

    function goToBlock(reason) {
      const params = new URLSearchParams({ reason: reason || "" });
      window.location.href = `block.html?${params.toString()}`;
    }

    function showError(message) {
      document.getElementById("spinner").style.display = "none";
      document.getElementById("statusTitle").textContent = "검사를 완료할 수 없습니다";
      document.getElementById("errorBox").style.display = "block";
      document.getElementById("errorDetail").textContent = message;
      document.getElementById("retryBtn").style.display = "inline-block";
    }

    // ============================================================
    // /check API 호출
    // ============================================================

    async function runCheck() {
      // 재시도 시 UI 초기화
      document.getElementById("spinner").style.display = "block";
      document.getElementById("statusTitle").textContent = "사이트 안전성 검사 중입니다...";
      document.getElementById("errorBox").style.display = "none";
      document.getElementById("retryBtn").style.display = "none";

      try {
        const response = await fetch(`${API_BASE_URL}/check`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: targetUrl }),
        });

        if (!response.ok) {
          throw new Error(`서버 응답 오류 (status ${response.status})`);
        }

        const data = await response.json();

        // data: { url, blocked, prediction, probability, verdict }

        if (data.blocked) {
          goToBlock(data.verdict);
        } else if (data.verdict === "Suspicious") {
          // 의심스러운 경우: 정책에 따라 추가 인증 페이지로 보내려면 여기서 분기
          // 지금은 로그인 페이지로 보내되, 필요시 login.html?mfa=1 형태로 변경 가능
          window.location.href = `login.html?warn=1`;
        } else {
          goToLogin();
        }

      } catch (err) {
        console.error("URL 검사 실패:", err);

        if (FAIL_OPEN) {
          // 검사 실패 시 로그인 허용 (권장하지 않음)
          goToLogin();
        } else {
          showError(err.message || "알 수 없는 오류가 발생했습니다.");
        }
      }
    }

    // ============================================================
    // 페이지 로드 시 자동 실행
    // ============================================================

    runCheck();
  </script>

</body>
</html>
