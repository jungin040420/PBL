<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI URL Checker - 안전 접속 확인</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f1f5f9;
    padding: 20px;
  }

  .card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 460px;
    text-align: center;
    backdrop-filter: blur(8px);
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  p.subtitle {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 24px;
  }

  .input-group {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  #urlInput {
    flex: 1;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(0, 0, 0, 0.3);
    color: #f1f5f9;
    font-size: 14px;
    outline: none;
  }

  #urlInput:focus {
    border-color: #38bdf8;
  }

  #urlInput::placeholder {
    color: #64748b;
  }

  .check-btn {
    padding: 12px 20px;
    background: #38bdf8;
    color: #0f172a;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }

  .check-btn:hover {
    background: #0ea5e9;
  }

  .check-btn:disabled {
    background: #475569;
    cursor: not-allowed;
  }

  .spinner {
    display: none;
    width: 40px;
    height: 40px;
    margin: 20px auto;
    border: 4px solid rgba(255, 255, 255, 0.15);
    border-top-color: #38bdf8;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .result-box {
    display: none;
    margin-top: 20px;
    padding: 20px;
    border-radius: 10px;
    text-align: left;
  }

  .result-box.legitimate {
    background: rgba(34, 197, 94, 0.1);
    border: 1px solid rgba(34, 197, 94, 0.35);
  }

  .result-box.suspicious {
    background: rgba(245, 158, 11, 0.1);
    border: 1px solid rgba(245, 158, 11, 0.35);
  }

  .result-box.malicious {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.35);
  }

  .verdict-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .legitimate .verdict-title { color: #86efac; }
  .suspicious .verdict-title { color: #fcd34d; }
  .malicious .verdict-title { color: #fca5a5; }

  .verdict-detail {
    font-size: 13px;
    color: #cbd5e1;
    word-break: break-all;
    margin-bottom: 8px;
  }

  .redirect-notice {
    font-size: 12px;
    color: #94a3b8;
  }

  .error-box {
    display: none;
    margin-top: 20px;
    padding: 16px;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.35);
    border-radius: 10px;
    font-size: 13px;
    color: #fecaca;
    text-align: left;
  }
</style>
</head>
<body>

  <div class="card">
    <h1 id="pageTitle">AI 피싱 URL 검사</h1>
    <p class="subtitle" id="pageSubtitle">확인하고 싶은 웹사이트 주소를 입력하세요.</p>

    <div class="input-group" id="inputGroup">
      <input
        type="text"
        id="urlInput"
        placeholder="https://example.com"
        onkeydown="if(event.key==='Enter') runCheck()"
      />
      <button class="check-btn" id="checkBtn" onclick="runCheck()">검사</button>
    </div>

    <div class="spinner" id="spinner"></div>

    <div class="result-box" id="resultBox">
      <div class="verdict-title" id="verdictTitle"></div>
      <div class="verdict-detail" id="verdictDetail"></div>
      <div class="redirect-notice" id="redirectNotice"></div>
    </div>

    <div class="error-box" id="errorBox">
      <strong>⚠ 검사 요청에 실패했습니다.</strong>
      <div id="errorDetail" style="margin-top: 6px;"></div>
    </div>
  </div>

  <script>
    const API_BASE_URL = "/urlcheck_api";
    const REDIRECT_DELAY_LEGITIMATE = 1500;

    const params = new URLSearchParams(window.location.search);
    const redirectTarget = params.get("redirect");

    window.addEventListener("DOMContentLoaded", () => {
      if (redirectTarget) {
        document.getElementById("pageTitle").textContent = "안전 접속 확인 중";
        document.getElementById("pageSubtitle").textContent =
          "요청하신 링크의 목적지를 자동으로 확인하고 있습니다.";
        document.getElementById("inputGroup").style.display = "none";
        document.getElementById("urlInput").value = redirectTarget;
        runCheck();
      }
    });

    function resetUI() {
      document.getElementById("resultBox").style.display = "none";
      document.getElementById("errorBox").style.display = "none";
      document.getElementById("redirectNotice").innerHTML = "";
    }

    function showResult(data) {
      const box = document.getElementById("resultBox");
      const title = document.getElementById("verdictTitle");
      const detail = document.getElementById("verdictDetail");
      const notice = document.getElementById("redirectNotice");

      box.className = "result-box";
      detail.textContent =
        `검사한 URL: ${data.url} · 위험 확률: ${(data.probability * 100).toFixed(1)}%`;

      if (data.verdict === "Malicious") {
        box.classList.add("malicious");
        title.textContent = "🚨 위험한 사이트입니다";
        notice.textContent = "접속이 완전히 차단되었습니다.";

      } else if (data.verdict === "Suspicious") {
        box.classList.add("suspicious");
        title.textContent = "⚠ 의심스러운 사이트입니다";
        notice.innerHTML = `
          이 사이트는 위험 요소가 일부 발견되어 로그인을 진행할 수 없습니다.<br>
          URL을 다시 확인해주세요.<br><br>
          <button class="check-btn" onclick="retryCheck()">다시 검사하기</button>
        `;

      } else {
        box.classList.add("legitimate");
        title.textContent = "✅ 안전한 사이트입니다";
        notice.textContent = "잠시 후 로그인 화면으로 이동합니다...";
        setTimeout(() => {
          window.location.href = "/login.html";
        }, REDIRECT_DELAY_LEGITIMATE);
      }

      box.style.display = "block";
    }

    function retryCheck() {
      resetUI();
      document.getElementById("pageTitle").textContent = "AI 피싱 URL 검사";
      document.getElementById("pageSubtitle").textContent = "확인하고 싶은 웹사이트 주소를 입력하세요.";
      document.getElementById("inputGroup").style.display = "flex";
      document.getElementById("urlInput").value = "";
      document.getElementById("urlInput").focus();
    }

    function showError(message) {
      document.getElementById("errorBox").style.display = "block";
      document.getElementById("errorDetail").textContent = message;
    }

    async function runCheck() {
      const targetUrl =
        redirectTarget || document.getElementById("urlInput").value.trim();

      if (!targetUrl) {
        alert("검사할 URL을 입력해주세요.");
        return;
      }

      resetUI();
      document.getElementById("spinner").style.display = "block";
      document.getElementById("checkBtn").disabled = true;

      try {
        const response = await fetch(`${API_BASE_URL}/check`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: targetUrl }),
        });

        if (!response.ok) {
          throw new Error(`서버 응답 오류 (status ${response.status})`);
        }

        const data = await response.json();
        showResult(data);

      } catch (err) {
        console.error("URL 검사 실패:", err);
        showError(err.message || "알 수 없는 오류가 발생했습니다.");
      } finally {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("checkBtn").disabled = false;
      }
    }
  </script>

</body>
</html>
