<!-- 로그인 페이지 -->
<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>로그인</title>

  <link rel="stylesheet" href="./cs/style.css" />
</head>

<body>

  <div class="card">

    <h2>로그인</h2>

    <div id="loginFormArea">
      <div class="field">
        <label for="username">사용자 아이디</label>
        <input type="text" id="username" autocomplete="username webauthn" />
      </div>
    </div>

    <div id="status">
      Passkey 로그인을 진행해주세요.
    </div>

    <div id="reauthArea" class="field" style="display: none;">
      <label for="otpInput">이메일로 전송된 인증 코드</label>
      <input type="text" id="otpInput" inputmode="numeric" maxlength="6" autocomplete="one-time-code"
        placeholder="6자리 숫자" />
      <button id="otpSubmitBtn" onclick="submitOtp()">인증 코드 확인</button>
      <p id="otpTimer" style="font-size: 0.8rem; color: #6b7280; text-align: center;"></p>
    </div>

    <div id="authBtnGroup">
      <button type="button" id="loginBtn" onclick="startPasskeyLogin()">
        Passkey로 로그인
      </button>
      <button type="button" class="btn-secondary" onclick="location.href='/register.html'">
        회원가입
      </button>
    </div>

    <button type="button" id="logoutBtn" class="btn-danger" onclick="startLogout()" style="display: none;">
      로그아웃
    </button>
  </div>

  <!-- Passkey 로그인 로직 -->
  <script src="/js/login.js"></script>


</body>

</html>
