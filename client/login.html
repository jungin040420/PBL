<!-- 로그인 페이지 -->
<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>로그인</title>

  <link rel="stylesheet" href="./cs/style.css" />
</head>

<body>

  <div class="card">

    <h2>로그인</h2>

    <div id="loginFormArea">
      <div class="field">
        <label for="username">사용자 아이디</label>
        <input type="text" id="username" autocomplete="username webauthn" />
      </div>
    </div>

    <div id="status">
      Passkey 로그인을 진행해주세요.
    </div>

    <div id="reauthArea" class="field" style="display: none;">
      <label for="otpInput">이메일로 전송된 인증 코드</label>
      <input type="text" id="otpInput" inputmode="numeric" maxlength="6" autocomplete="one-time-code"
        placeholder="6자리 숫자" />
      <button id="otpSubmitBtn" onclick="submitOtp()">인증 코드 확인</button>
      <p id="otpTimer" style="font-size: 0.8rem; color: #6b7280; text-align: center;"></p>
    </div>

    <div id="authBtnGroup">
      <button type="button" id="loginBtn" onclick="startPasskeyLogin()">
        Passkey로 로그인
      </button>
      <button type="button" class="btn-secondary" onclick="location.href='/register.html'">
        회원가입
      </button>
    </div>

    <button type="button" id="logoutBtn" class="btn-danger" onclick="startLogout()" style="display: none;">
      로그아웃
    </button>
  </div>

  <!-- Passkey 로그인 로직 -->
  <script src="/js/login.js"></script>


  <!--
============================================================
AI 사이트 검사 기능

현재는 ML / Passkey 인증 검증을 위해 비활성화한다.

향후 /api/site-check 연동이 정상화되면
아래 로직을 복구하여 사용할 수 있다.

중요:
사이트 검사 API 장애가 로그인 기능 전체를
막지 않도록 fallback 정책을 별도로 결정해야 한다.
============================================================

<script>

window.addEventListener(
  "load",
  async () => {

    const status =
      document.getElementById(
        "status"
      );

    const loginBtn =
      document.getElementById(
        "loginBtn"
      );


    try {

      const response =
        await fetch(
          "/api/site-check"
        );


      if (!response.ok) {

        throw new Error(
          "사이트 검사 실패"
        );

      }


      const result =
        await response.json();


      if (result.safe) {

        status.textContent =
          "✅ 안전한 사이트입니다.";

        status.style.color =
          "green";

        loginBtn.disabled =
          false;

      }

      else {

        status.textContent =
          "⚠️ 안전하지 않은 사이트입니다.";

        status.style.color =
          "red";

        loginBtn.disabled =
          true;

      }

    }

    catch (error) {

      console.error(
        error
      );

      status.textContent =
        "❌ 사이트 검사를 완료할 수 없습니다.";

      status.style.color =
        "red";

      // 사이트 검사 장애 시 로그인까지 막을지 여부는
      // 추후 보안 정책 확정 후 결정한다.
      loginBtn.disabled =
        false;

    }

  }
);

</script>

-->

</body>

</html>
