<!-- 로그인 페이지 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0"
  />
  <title>로그인</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
<div class="card">
  <h2>로그인</h2>

  <div class="field">
    <label for="username">사용자 아이디</label>

    <input
            type="text"
            id="username"
            autocomplete="username webauthn"
    />
  </div>

  <div id="status">
    🔍 사이트를 검사하는 중...
  </div>

  <!-- 검사 완료 전에는 비활성화 -->
  <button
          type="button"
          id="loginBtn"
          onclick="startPasskeyLogin()"
  >
    Passkey로 로그인
  </button>

  <button
          type="button"
          onclick="location.href='/register.html'"
  >
    회원가입
  </button>
</div>

<script src="/js/login.js"></script>
