<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>접속 차단됨</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #3b0d0d 0%, #1a0505 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f1f5f9;
    padding: 20px;
  }

  .card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 440px;
    text-align: center;
    backdrop-filter: blur(8px);
  }

  .icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    background: rgba(239, 68, 68, 0.15);
    border: 2px solid rgba(239, 68, 68, 0.5);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
  }

  h1 {
    font-size: 21px;
    font-weight: 700;
    color: #fecaca;
    margin-bottom: 10px;
  }

  p.desc {
    font-size: 14px;
    color: #cbd5e1;
    line-height: 1.6;
    margin-bottom: 20px;
  }

  .detail-box {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 16px;
    text-align: left;
    font-size: 13px;
    margin-bottom: 24px;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  .detail-row:last-child {
    border-bottom: none;
  }

  .detail-label {
    color: #94a3b8;
    white-space: nowrap;
  }

  .detail-value {
    color: #f1f5f9;
    text-align: right;
    word-break: break-all;
    font-weight: 600;
  }

  .detail-value.danger {
    color: #f87171;
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  button, a.btn {
    display: block;
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    text-decoration: none;
    cursor: pointer;
    border: none;
  }

  .btn-primary {
    background: #ef4444;
    color: #fff;
  }

  .btn-primary:hover {
    background: #dc2626;
  }

  .btn-secondary {
    background: rgba(255, 255, 255, 0.08);
    color: #cbd5e1;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.14);
  }

  .footnote {
    margin-top: 20px;
    font-size: 11px;
    color: #64748b;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="icon">🚫</div>
    <h1>접속이 차단되었습니다</h1>
    <p class="desc">
      AI 기반 분석 결과, 이 사이트는 <strong>피싱 사이트로 의심</strong>됩니다.<br>
      안전을 위해 로그인 페이지 접속이 차단되었습니다.
    </p>

    <div class="detail-box">
      <div class="detail-row">
        <span class="detail-label">검사 대상 URL</span>
        <span class="detail-value" id="detailUrl">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">AI 판정</span>
        <span class="detail-value danger" id="detailVerdict">-</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="window.close(); history.back();">이 사이트 나가기</button>
      <a class="btn-secondary" href="index.html">다시 검사하기</a>
    </div>

    <p class="footnote">
      이 판정이 잘못되었다고 생각되시면 관리자에게 문의해주세요.
    </p>
  </div>

  <script>
    // ============================================================
    // index.html에서 넘어온 쿼리 파라미터 표시
    // ============================================================

    const params = new URLSearchParams(window.location.search);
    const reason = params.get("reason") || "알 수 없음";

    document.getElementById("detailVerdict").textContent = reason;

    // 원래 검사하려던 URL은 referrer 또는 별도 파라미터로 전달받을 수 있음
    document.getElementById("detailUrl").textContent =
      document.referrer || window.location.hostname || "-";
  </script>

</body>
</html>
