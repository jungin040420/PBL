version: '3'

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=authuser
      - MYSQL_PASSWORD=authpass
      - MYSQL_DATABASE=authdb
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHON_RISK_URL=http://python:8000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./node-server:/app
      - /app/node_modules
    networks:
      - dev-network
    restart: unless-stopped
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 0
        order: stop-first

  python:
    build:
      context: ./python-risk
      dockerfile: Dockerfile
    container_name: auth_python
    ports:
      - "8000:8000"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=authuser
      - MYSQL_PASSWORD=authpass
      - MYSQL_DATABASE=authdb
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./python-risk:/app
    networks:
      - dev-network
    restart: unless-stopped
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 0
        order: stop-first

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    volumes:
      - ./ml-service:/app
    command: python main.py --reload
    networks:
      - dev-network
   


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.5.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.5.0
    container_name: kibana
    ports:
      - "5601:5601"

  node-server:
    build: ./node-server
    container_name: node-server
    ports:
      - "3000:3000"
    depends_on:
      - elasticsearch